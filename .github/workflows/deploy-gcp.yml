# Deploys server/ to Cloud Run and web/ to Firebase Hosting, authenticated
# via Workload Identity Federation (no long-lived GCP key stored as a
# secret). Manually triggered for now (workflow_dispatch) rather than on
# every push to main — switch the `on:` block below to `push: branches:
# [main]` once you trust this pipeline for continuous deployment.
#
# Architecture notes specific to this GCP org, which shaped several
# choices below and aren't the default path most GCP tutorials assume:
#   - constraints/sql.restrictPublicIp is enforced org-wide, so the Cloud
#     SQL instance CANNOT have a public IP at all. It's private-IP-only.
#   - The org uses Shared VPC — the actual VPC network/subnets live in a
#     separate host project, administered by someone else. Anything that
#     touches that network (creating the private-services-access peering,
#     granting roles/compute.networkUser) has to go through that admin;
#     it isn't self-servable from this project.
#   - Because of both of the above, Cloud Run (and the migration Job)
#     need Direct VPC egress configured to reach the database at all —
#     not just the Cloud SQL connector on its own.
#
# Status as of the instance being created (console, not gcloud, since the
# gcloud custom-tier flags kept colliding with org constraints):
#   [x] Cloud SQL instance: private IP, Shared VPC, PostgreSQL 18,
#       Enterprise edition (not Enterprise Plus — that edition forces
#       predefined db-perf-optimized-* tiers instead of a custom
#       cpu/memory config), 1 vCPU / 4GB, region us-east1.
#   [x] Artifact Registry repo (boston-parking, docker format, us-east1 —
#       matches the Cloud SQL instance's region; Cloud Run and the
#       migration Job below should both target this same region too).
#   [ ] Everything else below this point.
#
# None of the following can be done from this file — it's GCP console /
# gcloud CLI work, once, before this workflow can run successfully:
#
# 1. Create a GCP project (or use an existing one) and enable billing.
#
# 2. Enable required APIs:
#      gcloud services enable run.googleapis.com sqladmin.googleapis.com \
#        artifactregistry.googleapis.com secretmanager.googleapis.com \
#        iamcredentials.googleapis.com firebasehosting.googleapis.com \
#        servicenetworking.googleapis.com compute.googleapis.com
#
# 3. On the instance's Databases and Users tabs (console), create the
#    `boston_parking` database and a `boston_parking_app` user with its
#    own password (don't reuse the postgres root user for the app). Then
#    note the instance's connection name (PROJECT:REGION:INSTANCE) from
#    its Overview page.
#
# 4. Store the resulting connection string in Secret Manager, e.g.:
#      echo -n "postgresql://USER:PASSWORD@localhost/DBNAME?host=/cloudsql/PROJECT:REGION:INSTANCE" \
#        | gcloud secrets create boston-parking-database-url --data-file=-
#
# 5. Create an Artifact Registry repo for the API image:
#      gcloud artifacts repositories create boston-parking \
#        --repository-format=docker --location=REGION
#
# 6. Set up Workload Identity Federation for GitHub Actions (one-time).
#    Using "through a Service Account" (not the newer "Direct" pattern
#    google-github-actions/auth now prefers) since not every resource
#    here supports principalSet identities directly. Exact commands from
#    https://github.com/google-github-actions/auth#indirect-wif :
#
#      # TODO: replace PROJECT_ID with your value.
#      gcloud iam service-accounts create boston-parking-deployer \
#        --project=PROJECT_ID
#
#      gcloud iam workload-identity-pools create github \
#        --project=PROJECT_ID --location=global \
#        --display-name="GitHub Actions Pool"
#
#      gcloud iam workload-identity-pools providers create-oidc double-trouble \
#        --project=PROJECT_ID --location=global \
#        --workload-identity-pool=github \
#        --display-name="double_trouble Provider" \
#        --attribute-mapping="google.subject=assertion.sub,attribute.actor=assertion.actor,attribute.repository=assertion.repository,attribute.repository_owner=assertion.repository_owner" \
#        --attribute-condition="assertion.repository_owner == 'OETBoston'" \
#        --issuer-uri="https://token.actions.githubusercontent.com"
#
#      # Get the pool's full ID first (needed for the next command):
#      gcloud iam workload-identity-pools describe github \
#        --project=PROJECT_ID --location=global --format="value(name)"
#      # -> projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github
#
#      # Scoped to this exact repo, not just the org, as defense in depth
#      # on top of the provider's org-level attribute-condition above:
#      gcloud iam service-accounts add-iam-policy-binding \
#        boston-parking-deployer@PROJECT_ID.iam.gserviceaccount.com \
#        --project=PROJECT_ID \
#        --role=roles/iam.workloadIdentityUser \
#        --member="principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/attribute.repository/OETBoston/double_trouble"
#
#      # Grant the deploy service account the actual GCP permissions it needs:
#      for role in roles/run.admin roles/artifactregistry.writer \
#                  roles/iam.serviceAccountUser roles/secretmanager.secretAccessor \
#                  roles/firebasehosting.admin; do
#        gcloud projects add-iam-policy-binding PROJECT_ID \
#          --member="serviceAccount:boston-parking-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#          --role="$role"
#      done
#
#      # Get the provider's full resource name for the GCP_WORKLOAD_IDENTITY_PROVIDER
#      # secret below:
#      gcloud iam workload-identity-pools providers describe double-trouble \
#        --project=PROJECT_ID --location=global --workload-identity-pool=github \
#        --format="value(name)"
#
#    GCP_SERVICE_ACCOUNT = boston-parking-deployer@PROJECT_ID.iam.gserviceaccount.com
#
# 6a. Because the Cloud SQL instance is private-IP-only on a Shared VPC,
#     both Cloud Run (via Direct VPC egress) and the migration Job below
#     need to reach it over that network — which means the deploy service
#     account from step 6 (and, at runtime, the Cloud Run service's own
#     identity) needs roles/compute.networkUser granted BY THE VPC's HOST
#     PROJECT ADMIN on the specific subnet in this region. This can't be
#     self-served from this project; ask the host project's admin.
#
# 7. Create a Cloud Run Job that runs migrations against the same image,
#    once the first image exists in Artifact Registry. Include the same
#    Direct VPC egress flags as the Cloud Run service below, since the
#    job also needs to reach the private-IP database:
#      gcloud run jobs create boston-parking-migrate \
#        --image=REGION-docker.pkg.dev/PROJECT/boston-parking/api:latest \
#        --region=REGION \
#        --network=projects/HOST_PROJECT_ID/global/networks/NETWORK_NAME \
#        --subnet=projects/HOST_PROJECT_ID/regions/REGION/subnetworks/SUBNET_NAME \
#        --vpc-egress=private-ranges-only \
#        --set-cloudsql-instances=PROJECT:REGION:INSTANCE \
#        --set-secrets=DATABASE_URL=boston-parking-database-url:latest \
#        --command=npx --args=prisma,migrate,deploy
#
# 8. Run `firebase init hosting` in web/ once (or just fill in
#    web/.firebaserc's project ID directly) to connect it to a Firebase
#    Hosting site under the same GCP project.
#
# Repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER = provider resource name from step 6
#   - GCP_SERVICE_ACCOUNT            = deploy service account email from step 6
#   - VITE_MAPBOX_TOKEN              = the frontend's Mapbox public token
#
# Repo variables (same place, Variables tab):
#   - GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_SQL_CONNECTION_NAME,
#     GCP_CLOUD_RUN_SERVICE, GCP_MIGRATE_JOB, PRODUCTION_FRONTEND_URL,
#     GCP_DB_SECRET_NAME, GCP_VPC_NETWORK
#     (full path: projects/HOST_PROJECT_ID/global/networks/NETWORK_NAME),
#     GCP_VPC_SUBNET (full path:
#     projects/HOST_PROJECT_ID/regions/REGION/subnetworks/SUBNET_NAME)
#   (PRODUCTION_API_URL is deliberately not a variable -- it's read live
#   from the deploy-api job's output instead, since Cloud Run's default
#   URL includes an unpredictable hash and can't be known ahead of time.)

name: Deploy to GCP

on:
  workflow_dispatch: {}

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    outputs:
      image: ${{ steps.build.outputs.image }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push image
        id: build
        working-directory: server
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        run: |
          gcloud run jobs update ${{ vars.GCP_MIGRATE_JOB }} \
            --region "${{ vars.GCP_REGION }}" \
            --image "${{ steps.build.outputs.image }}"
          gcloud run jobs execute ${{ vars.GCP_MIGRATE_JOB }} \
            --region "${{ vars.GCP_REGION }}" \
            --wait

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.build.outputs.image }}
          # --add-cloudsql-instances alone isn't enough once the instance
          # is private-IP-only: Cloud Run also needs Direct VPC egress to
          # actually route to that private IP over the Shared VPC. Both
          # together is Google's recommended pairing for private IP (the
          # connector still handles the encrypted/IAM-authenticated
          # connection; VPC egress just makes the network path exist).
          flags: >-
            --add-cloudsql-instances=${{ vars.GCP_SQL_CONNECTION_NAME }}
            --network=${{ vars.GCP_VPC_NETWORK }}
            --subnet=${{ vars.GCP_VPC_SUBNET }}
            --vpc-egress=private-ranges-only
          secrets: |
            DATABASE_URL=${{ vars.GCP_DB_SECRET_NAME }}:latest
          env_vars: |
            CORS_ORIGIN=${{ vars.PRODUCTION_FRONTEND_URL }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The Cloud Run default URL includes an unpredictable hash
          # component, so it can't be known ahead of time as a static
          # variable the way PRODUCTION_FRONTEND_URL (a stable Firebase
          # Hosting URL) can -- read it live from the deploy-api job
          # instead of pre-setting it.
          VITE_API_URL: ${{ needs.deploy-api.outputs.url }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
