name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Backend (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Backend tests mock Prisma entirely (no DB needed), but the
      # generated client's types are still required for tsc/vitest to
      # resolve `@prisma/client` imports.
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  web:
    name: Frontend (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
