services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: boston_parking
      POSTGRES_PASSWORD: boston_parking
      POSTGRES_DB: boston_parking
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boston_parking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
